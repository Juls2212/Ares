name: ares-development

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ARES_POSTGRES_DB:?Set ARES_POSTGRES_DB in .env}
      POSTGRES_USER: ${ARES_POSTGRES_USER:?Set ARES_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${ARES_POSTGRES_PASSWORD:?Set ARES_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ARES_POSTGRES_PORT:?Set ARES_POSTGRES_PORT in .env}:5432"
    volumes:
      - ares_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ares_postgres_data:
    name: ares_postgres_data
